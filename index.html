<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Truth or Dare - Dims.am_</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:
        radial-gradient(circle at top,#292957,#0b0b18 65%);
    color:white;
    min-height:100vh;
    overflow-x:hidden;
}

.container{
    width:min(900px,94%);
    margin:auto;
    padding:20px 0 40px;
}

h1{
    text-align:center;
    font-size:clamp(30px,7vw,58px);
    margin:15px 0 5px;
    font-weight:900;
    text-shadow:0 0 20px #8b5cf6;
}

.subtitle{
    text-align:center;
    color:#bbb;
    margin-bottom:10px;
}

.creator{
    text-align:center;
    margin-bottom:25px;
    font-size:15px;
    color:#aaa;
    letter-spacing:1px;
}

.creator span{
    color:#d8b4fe;
    font-weight:900;
    text-shadow:0 0 12px #a855f7;
}

.card{
    background:rgba(255,255,255,.07);
    border:1px solid rgba(255,255,255,.15);
    backdrop-filter:blur(12px);
    border-radius:25px;
    padding:25px;
    box-shadow:0 20px 60px rgba(0,0,0,.4);
}

.menu{
    max-width:550px;
    margin:30px auto;
}

.menu h2{
    text-align:center;
    margin-bottom:20px;
}

input{
    width:100%;
    padding:15px;
    margin:7px 0;
    border:none;
    border-radius:12px;
    background:#17172a;
    color:white;
    font-size:16px;
    outline:none;
}

input:focus{
    box-shadow:0 0 0 2px #8b5cf6;
}

button{
    border:none;
    border-radius:14px;
    padding:15px 22px;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    color:white;
    transition:.2s;
}

button:hover{
    transform:translateY(-2px);
    filter:brightness(1.15);
}

button:disabled{
    opacity:.45;
    cursor:not-allowed;
    transform:none;
}

.start-btn{
    width:100%;
    margin-top:15px;
    background:linear-gradient(135deg,#8b5cf6,#ec4899);
}

.game{
    display:none;
}

.status{
    text-align:center;
    font-size:21px;
    font-weight:bold;
    margin-bottom:20px;
    min-height:30px;
}

.wheel-area{
    display:flex;
    justify-content:center;
    margin:15px auto 25px;
}

.wheel-container{
    position:relative;
    width:min(350px,80vw);
    height:min(350px,80vw);
}

.wheel{
    width:100%;
    height:100%;
    border-radius:50%;
    border:8px solid white;
    box-shadow:
        0 0 0 5px rgba(255,255,255,.1),
        0 0 40px rgba(139,92,246,.5);
    position:relative;
    overflow:hidden;
    transition:transform 4s cubic-bezier(.12,.7,.15,1);
}

.player-wheel{
    background:conic-gradient(
        #2196f3 0deg 90deg,
        #ff1744 90deg 180deg,
        #00c853 180deg 270deg,
        #ff9800 270deg 360deg
    );
}

.td-wheel{
    background:conic-gradient(
        #2196f3 0deg 180deg,
        #ff1744 180deg 360deg
    );
}

.wheel-label{
    position:absolute;
    left:50%;
    top:50%;
    transform-origin:center;
    font-size:20px;
    font-weight:900;
    text-shadow:2px 2px 4px #000;
    white-space:nowrap;
}

.player-wheel .label1{
    transform:translate(-50%,-50%) rotate(45deg) translateY(-105px);
}

.player-wheel .label2{
    transform:translate(-50%,-50%) rotate(135deg) translateY(-105px);
}

.player-wheel .label3{
    transform:translate(-50%,-50%) rotate(225deg) translateY(-105px);
}

.player-wheel .label4{
    transform:translate(-50%,-50%) rotate(315deg) translateY(-105px);
}

.td-wheel .truth-label{
    transform:translate(-50%,-50%) rotate(90deg) translateY(-105px);
}

.td-wheel .dare-label{
    transform:translate(-50%,-50%) rotate(270deg) translateY(-105px);
}

.pointer{
    position:absolute;
    z-index:5;
    top:-17px;
    left:50%;
    transform:translateX(-50%);
    width:0;
    height:0;
    border-left:18px solid transparent;
    border-right:18px solid transparent;
    border-top:42px solid white;
    filter:drop-shadow(0 3px 4px #000);
}

.center{
    position:absolute;
    z-index:4;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    width:72px;
    height:72px;
    background:#111;
    border:5px solid white;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:900;
    font-size:14px;
    box-shadow:0 0 20px #000;
}

.spin-btn{
    display:block;
    margin:auto;
    background:linear-gradient(135deg,#7c3aed,#db2777);
    min-width:240px;
    font-size:18px;
}

.next-btn{
    background:linear-gradient(135deg,#00b894,#00cec9);
    width:100%;
    margin-top:15px;
}

.reset-btn{
    background:#444;
    width:100%;
    margin-top:10px;
}

.result{
    text-align:center;
    margin-top:20px;
    display:none;
}

.selected-player{
    font-size:30px;
    font-weight:900;
    margin-bottom:10px;
    color:#facc15;
}

.type{
    display:inline-block;
    padding:10px 22px;
    border-radius:30px;
    font-size:20px;
    font-weight:900;
    margin-bottom:15px;
}

.truth{
    background:#2196f3;
}

.dare{
    background:#ff1744;
}

.challenge{
    font-size:23px;
    line-height:1.4;
    padding:20px;
    background:rgba(0,0,0,.3);
    border-radius:18px;
    margin-top:10px;
}

.points{
    margin-top:15px;
    color:#facc15;
    font-weight:bold;
}

.scoreboard{
    margin-top:25px;
}

.scoreboard h3{
    text-align:center;
    margin-bottom:10px;
}

.score{
    display:flex;
    justify-content:space-between;
    align-items:center;
    background:rgba(255,255,255,.06);
    padding:12px 15px;
    border-radius:12px;
    margin:6px 0;
}

.score strong{
    color:#facc15;
}

.hidden{
    display:none!important;
}

@media(max-width:500px){

    .card{
        padding:18px;
    }

    .wheel-container{
        width:290px;
        height:290px;
    }

    .wheel-label{
        font-size:15px;
    }

    .player-wheel .label1,
    .player-wheel .label2,
    .player-wheel .label3,
    .player-wheel .label4{
        font-size:14px;
    }

    .player-wheel .label1{
        transform:translate(-50%,-50%) rotate(45deg) translateY(-85px);
    }

    .player-wheel .label2{
        transform:translate(-50%,-50%) rotate(135deg) translateY(-85px);
    }

    .player-wheel .label3{
        transform:translate(-50%,-50%) rotate(225deg) translateY(-85px);
    }

    .player-wheel .label4{
        transform:translate(-50%,-50%) rotate(315deg) translateY(-85px);
    }

    .td-wheel .truth-label{
        transform:translate(-50%,-50%) rotate(90deg) translateY(-85px);
    }

    .td-wheel .dare-label{
        transform:translate(-50%,-50%) rotate(270deg) translateY(-85px);
    }

    .challenge{
        font-size:19px;
    }
}
</style>
</head>

<body>

<div class="container">

<h1>🔥 TRUTH OR DARE 🔥</h1>

<div class="subtitle">
    Spin Battle — 4 Pemain
</div>

<div class="creator">
    ✨ Create by <span>Dims.am_</span>
</div>

<!-- MENU -->
<div class="card menu" id="menu">

    <h2>👥 Masukkan Nama Pemain</h2>

    <input id="p1" placeholder="Pemain 1">
    <input id="p2" placeholder="Pemain 2">
    <input id="p3" placeholder="Pemain 3">
    <input id="p4" placeholder="Pemain 4">

    <button class="start-btn" onclick="startGame()">
        🚀 MULAI GAME
    </button>

</div>

<!-- GAME -->
<div class="game" id="game">

    <div class="card">

        <div class="status" id="status">
            🎡 Siap menentukan pemain...
        </div>

        <!-- PLAYER WHEEL -->
        <div class="wheel-area" id="playerArea">

            <div class="wheel-container">

                <div class="pointer"></div>

                <div class="wheel player-wheel" id="playerWheel">

                    <div class="wheel-label label1" id="label1">
                        Pemain 1
                    </div>

                    <div class="wheel-label label2" id="label2">
                        Pemain 2
                    </div>

                    <div class="wheel-label label3" id="label3">
                        Pemain 3
                    </div>

                    <div class="wheel-label label4" id="label4">
                        Pemain 4
                    </div>

                    <div class="center">
                        SPIN
                    </div>

                </div>

            </div>

        </div>

        <!-- TRUTH DARE WHEEL -->
        <div class="wheel-area hidden" id="tdArea">

            <div class="wheel-container">

                <div class="pointer"></div>

                <div class="wheel td-wheel" id="tdWheel">

                    <div class="wheel-label truth-label">
                        TRUTH
                    </div>

                    <div class="wheel-label dare-label">
                        DARE
                    </div>

                    <div class="center">
                        T / D
                    </div>

                </div>

            </div>

        </div>

        <button
            class="spin-btn"
            id="spinBtn"
            onclick="spinPlayer()">
            🎡 SPIN PEMAIN
        </button>

        <!-- RESULT -->
        <div class="result" id="result">

            <div class="selected-player" id="selectedPlayer"></div>

            <div class="type" id="type"></div>

            <div class="challenge" id="challenge"></div>

            <div class="points" id="points"></div>

            <button
                class="next-btn"
                onclick="nextRound()">
                🎡 SPIN PEMAIN BERIKUTNYA
            </button>

        </div>

        <!-- SCORE -->
        <div class="scoreboard">

            <h3>🏆 SCORE</h3>

            <div class="score">
                <span id="name0">Pemain 1</span>
                <strong id="score0">0</strong>
            </div>

            <div class="score">
                <span id="name1">Pemain 2</span>
                <strong id="score1">0</strong>
            </div>

            <div class="score">
                <span id="name2">Pemain 3</span>
                <strong id="score2">0</strong>
            </div>

            <div class="score">
                <span id="name3">Pemain 4</span>
                <strong id="score3">0</strong>
            </div>

        </div>

        <button class="reset-btn" onclick="location.reload()">
            🔄 KEMBALI KE MENU
        </button>

    </div>

</div>

</div>

<script>

let names = [];
let scores = [0,0,0,0];

let currentPlayer = -1;

let playerRotation = 0;
let tdRotation = 0;

let spinning = false;

const truths = [

"Siapa orang terakhir yang kamu stalk di media sosial?",

"Apa kebohongan terbesar yang pernah kamu lakukan?",

"Siapa orang yang paling kamu rindukan saat ini?",

"Kalau bisa mengulang satu kejadian, kejadian apa?",

"Apa hal paling memalukan yang pernah kamu lakukan?",

"Siapa orang yang paling kamu percaya?",

"Pernahkah kamu pura-pura tidak melihat pesan seseorang?",

"Apa rahasia yang belum pernah kamu ceritakan kepada teman?",

"Siapa orang yang menurutmu paling menarik di sini?",

"Apa kebiasaan aneh yang kamu punya?",

"Kalau mendapat Rp1 miliar, apa yang pertama kamu beli?",

"Siapa mantan yang paling sulit kamu lupakan?",

"Pernahkah kamu berbohong kepada pasangan?",

"Apa ketakutan terbesar kamu?",

"Siapa orang yang paling sering membuatmu kesal?",

"Apa hal yang paling kamu sesali?",

"Pernahkah kamu jatuh cinta pada orang yang salah?",

"Apa impian terbesar yang belum tercapai?",

"Siapa orang yang paling ingin kamu ajak liburan?",

"Kalau hidupmu jadi film, apa judulnya?"

];

const dares = [

"Joget bebas selama 20 detik tanpa musik.",

"Nyanyikan lagu favoritmu dengan suara paling lucu.",

"Telepon teman dan bilang: Aku baru jadi artis!",

"Lakukan 15 squat.",

"Berbicara dengan suara bayi selama 1 menit.",

"Pose seperti model selama 20 detik.",

"Tirukan gaya orang di sebelahmu.",

"Buat suara ayam selama 15 detik.",

"Lakukan push-up sebanyak 10 kali.",

"Berjalan seperti robot selama 30 detik.",

"Nyanyikan lagu nasional dengan gaya rock.",

"Biarkan pemain lain membuat gaya rambutmu.",

"Baca pesan terakhir di WhatsApp dengan suara keras.",

"Lakukan dance TikTok selama 20 detik.",

"Buat pantun spontan untuk pemain lain.",

"Berpura-pura menjadi presenter berita selama 30 detik.",

"Lakukan ekspresi marah, sedih, lalu bahagia.",

"Berdiri dengan satu kaki selama 30 detik.",

"Ucapkan alfabet dengan sangat cepat.",

"Berikan pujian kepada setiap pemain."

];

function startGame(){

    names = [

        document.getElementById("p1").value.trim() || "Pemain 1",

        document.getElementById("p2").value.trim() || "Pemain 2",

        document.getElementById("p3").value.trim() || "Pemain 3",

        document.getElementById("p4").value.trim() || "Pemain 4"

    ];

    scores = [0,0,0,0];

    currentPlayer = -1;

    playerRotation = 0;
    tdRotation = 0;

    document.getElementById("playerWheel").style.transform =
        "rotate(0deg)";

    document.getElementById("tdWheel").style.transform =
        "rotate(0deg)";

    for(let i=0;i<4;i++){

        document.getElementById("label"+(i+1)).textContent =
            names[i];

        document.getElementById("name"+i).textContent =
            names[i];

        document.getElementById("score"+i).textContent =
            "0";
    }

    document.getElementById("menu").style.display="none";

    document.getElementById("game").style.display="block";

    document.getElementById("result").style.display="none";

    document.getElementById("tdArea").classList.add("hidden");

    document.getElementById("playerArea").classList.remove("hidden");

    document.getElementById("spinBtn").disabled=false;

    document.getElementById("status").textContent =
        "🎡 Siapa yang main duluan?";

}

function spinPlayer(){

    if(spinning) return;

    spinning = true;

    document.getElementById("spinBtn").disabled=true;

    document.getElementById("result").style.display="none";

    document.getElementById("tdArea").classList.add("hidden");

    document.getElementById("playerArea").classList.remove("hidden");

    document.getElementById("status").textContent =
        "🎡 MENENTUKAN PEMAIN...";

    currentPlayer =
        Math.floor(Math.random()*4);

    const segmentCenter =
        currentPlayer * 90 + 45;

    const extraSpins = 6;

    playerRotation +=
        extraSpins * 360 +
        (360 - segmentCenter);

    document.getElementById("playerWheel").style.transform =
        `rotate(${playerRotation}deg)`;

    setTimeout(()=>{

        document.getElementById("status").textContent =
            "🔥 " + names[currentPlayer] +
            " TERPILIH!";

        document.getElementById("selectedPlayer").textContent =
            "🎯 " + names[currentPlayer];

        setTimeout(()=>{

            spinTruthDare();

        },1000);

    },4200);

}

function spinTruthDare(){

    document.getElementById("status").textContent =
        "🎡 MENENTUKAN TRUTH ATAU DARE...";

    document.getElementById("playerArea")
        .classList.add("hidden");

    document.getElementById("tdArea")
        .classList.remove("hidden");

    const choice =
        Math.floor(Math.random()*2);

    const segmentCenter =
        choice === 0 ? 90 : 270;

    const extraSpins = 5;

    tdRotation +=
        extraSpins * 360 +
        (360 - segmentCenter);

    document.getElementById("tdWheel").style.transform =
        `rotate(${tdRotation}deg)`;

    setTimeout(()=>{

        showChallenge(choice);

    },4200);

}

function showChallenge(choice){

    spinning = false;

    const type =
        document.getElementById("type");

    const challenge =
        document.getElementById("challenge");

    const points =
        document.getElementById("points");

    document.getElementById("result")
        .style.display="block";

    document.getElementById("selectedPlayer")
        .textContent =
        "🎯 " + names[currentPlayer];

    if(choice === 0){

        type.textContent = "💙 TRUTH";

        type.className = "type truth";

        const question =
            truths[
                Math.floor(Math.random()*truths.length)
            ];

        challenge.textContent =
            "❓ " + question;

        scores[currentPlayer] += 10;

        points.textContent =
            "⭐ Berhasil menjawab = +10 Poin";

        document.getElementById("status").textContent =
            "💙 WAKTUNYA TRUTH!";

    }else{

        type.textContent = "❤️ DARE";

        type.className = "type dare";

        const dare =
            dares[
                Math.floor(Math.random()*dares.length)
            ];

        challenge.textContent =
            "🔥 " + dare;

        scores[currentPlayer] += 20;

        points.textContent =
            "⭐ Berhasil melakukan = +20 Poin";

        document.getElementById("status").textContent =
            "❤️ WAKTUNYA DARE!";

    }

    updateScores();

}

function updateScores(){

    for(let i=0;i<4;i++){

        document.getElementById("score"+i)
            .textContent = scores[i];

    }

}

function nextRound(){

    if(spinning) return;

    document.getElementById("result")
        .style.display="none";

    document.getElementById("tdArea")
        .classList.add("hidden");

    document.getElementById("playerArea")
        .classList.remove("hidden");

    document.getElementById("status").textContent =
        "🎡 Menentukan pemain berikutnya...";

    setTimeout(()=>{

        spinPlayer();

    },400);

}

</script>

</body>
</html>
