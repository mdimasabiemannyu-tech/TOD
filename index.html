<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Truth or Dare - Dims.am_</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:
        radial-gradient(circle at top,#292957,#0b0b18 65%);
    color:white;
    min-height:100vh;
    overflow-x:hidden;
}

.container{
    width:min(900px,94%);
    margin:auto;
    padding:20px 0 40px;
}

h1{
    text-align:center;
    font-size:clamp(30px,7vw,58px);
    margin:15px 0 5px;
    font-weight:900;
    text-shadow:0 0 20px #8b5cf6;
}

.subtitle{
    text-align:center;
    color:#bbb;
    margin-bottom:10px;
}

.creator{
    text-align:center;
    margin-bottom:25px;
    font-size:15px;
    color:#aaa;
    letter-spacing:1px;
}

.creator span{
    color:#d8b4fe;
    font-weight:900;
    text-shadow:0 0 12px #a855f7;
}

.card{
    background:rgba(255,255,255,.07);
    border:1px solid rgba(255,255,255,.15);
    backdrop-filter:blur(12px);
    border-radius:25px;
    padding:25px;
    box-shadow:0 20px 60px rgba(0,0,0,.4);
}

.menu{
    max-width:550px;
    margin:30px auto;
}

.menu h2{
    text-align:center;
    margin-bottom:20px;
}

input{
    width:100%;
    padding:15px;
    margin:7px 0;
    border:none;
    border-radius:12px;
    background:#17172a;
    color:white;
    font-size:16px;
    outline:none;
}

input:focus{
    box-shadow:0 0 0 2px #8b5cf6;
}

button{
    border:none;
    border-radius:14px;
    padding:15px 22px;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    color:white;
    transition:.2s;
}

button:hover{
    transform:translateY(-2px);
    filter:brightness(1.15);
}

button:disabled{
    opacity:.45;
    cursor:not-allowed;
    transform:none;
}

.start-btn{
    width:100%;
    margin-top:15px;
    background:linear-gradient(135deg,#8b5cf6,#ec4899);
}

.game{
    display:none;
}

.status{
    text-align:center;
    font-size:21px;
    font-weight:bold;
    margin-bottom:20px;
    min-height:30px;
}

/* ================= WHEEL ================= */

.wheel-area{
    display:flex;
    justify-content:center;
    margin:15px auto 25px;
}

.wheel-container{
    position:relative;
    width:min(350px,80vw);
    height:min(350px,80vw);
}

.wheel{
    width:100%;
    height:100%;
    border-radius:50%;
    border:8px solid white;

    box-shadow:
        0 0 0 5px rgba(255,255,255,.1),
        0 0 40px rgba(139,92,246,.5);

    position:relative;
    overflow:hidden;

    transition:
        transform 4s cubic-bezier(.12,.7,.15,1);
}

.player-wheel{
    background:conic-gradient(
        #2196f3 0deg 90deg,
        #ff1744 90deg 180deg,
        #00c853 180deg 270deg,
        #ff9800 270deg 360deg
    );
}

.wheel-label{
    position:absolute;
    left:50%;
    top:50%;

    transform-origin:center;

    font-size:20px;
    font-weight:900;

    text-shadow:2px 2px 4px #000;

    white-space:nowrap;
}

.player-wheel .label1{
    transform:
        translate(-50%,-50%)
        rotate(45deg)
        translateY(-105px);
}

.player-wheel .label2{
    transform:
        translate(-50%,-50%)
        rotate(135deg)
        translateY(-105px);
}

.player-wheel .label3{
    transform:
        translate(-50%,-50%)
        rotate(225deg)
        translateY(-105px);
}

.player-wheel .label4{
    transform:
        translate(-50%,-50%)
        rotate(315deg)
        translateY(-105px);
}

.pointer{
    position:absolute;
    z-index:5;

    top:-17px;
    left:50%;

    transform:translateX(-50%);

    width:0;
    height:0;

    border-left:18px solid transparent;
    border-right:18px solid transparent;
    border-top:42px solid white;

    filter:drop-shadow(0 3px 4px #000);
}

.center{
    position:absolute;
    z-index:4;

    left:50%;
    top:50%;

    transform:translate(-50%,-50%);

    width:72px;
    height:72px;

    background:#111;

    border:5px solid white;

    border-radius:50%;

    display:flex;
    align-items:center;
    justify-content:center;

    font-weight:900;
    font-size:14px;

    box-shadow:0 0 20px #000;
}

/* ================= BUTTON ================= */

.spin-btn{
    display:block;
    margin:auto;

    background:
        linear-gradient(135deg,#7c3aed,#db2777);

    min-width:240px;

    font-size:18px;
}

.truth-btn{
    background:
        linear-gradient(135deg,#2196f3,#2563eb);

    width:48%;
}

.dare-btn{
    background:
        linear-gradient(135deg,#ff1744,#dc2626);

    width:48%;
}

.td-buttons{
    display:flex;
    justify-content:space-between;
    gap:10px;

    margin-top:20px;
}

.next-btn{
    background:
        linear-gradient(135deg,#00b894,#00cec9);

    width:100%;
    margin-top:15px;
}

.reset-btn{
    background:#444;
    width:100%;
    margin-top:10px;
}

/* ================= RESULT ================= */

.result{
    text-align:center;
    margin-top:20px;
    display:none;
}

.selected-player{
    font-size:30px;
    font-weight:900;

    margin-bottom:10px;

    color:#facc15;
}

.type{
    display:inline-block;

    padding:10px 22px;

    border-radius:30px;

    font-size:20px;
    font-weight:900;

    margin-bottom:15px;
}
