<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Snake Adventure - Level 1-10</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #111;
    color: white;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 15px;
}

.game {
    width: min(560px, 100%);
    text-align: center;
}

h1 {
    margin: 8px 0 12px;
    font-size: 28px;
}

.info {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 7px;
    margin-bottom: 10px;
}

.box {
    background: #222;
    border: 1px solid #444;
    border-radius: 10px;
    padding: 8px;
    font-size: 14px;
}

.box b {
    display: block;
    font-size: 20px;
    margin-top: 3px;
}

canvas {
    width: 100%;
    max-width: 520px;
    aspect-ratio: 1 / 1;
    background: #07120a;
    border: 3px solid #555;
    border-radius: 12px;
    display: block;
    margin: auto;
    touch-action: none;
}

.actions {
    display: flex;
    justify-content: center;
    gap: 8px;
    margin-top: 12px;
}

button {
    border: 0;
    border-radius: 10px;
    background: #333;
    color: white;
    font-size: 15px;
    font-weight: bold;
    height: 45px;
    padding: 0 15px;
    cursor: pointer;
}

button:active {
    transform: scale(.95);
}

#start {
    background: #16803c;
}

#pause {
    background: #555;
}

#restart {
    background: #8b2222;
}

.controls {
    margin: 15px auto 0;
    display: grid;
    grid-template-columns: repeat(3, 70px);
    gap: 7px;
    justify-content: center;
}

.controls button {
    height: 55px;
    font-size: 23px;
    padding: 0;
}

.empty {
    visibility: hidden;
}

.message {
    min-height: 25px;
    margin-top: 12px;
    color: #ddd;
    font-size: 14px;
    line-height: 1.4;
}
</style>
</head>

<body>

<div class="game">

    <h1>🐍 Snake Adventure</h1>

    <div class="info">
        <div class="box">
            LEVEL
            <b id="level">1</b>
        </div>

        <div class="box">
            SKOR
            <b id="score">0</b>
        </div>

        <div class="box">
            TARGET
            <b id="target">5</b>
        </div>
    </div>

    <canvas id="game" width="520" height="520"></canvas>

    <div class="actions">
        <button id="start">▶ Mulai</button>
        <button id="pause">⏸ Pause</button>
        <button id="restart">🔄 Ulangi</button>
    </div>

    <div class="controls">

        <button class="empty">.</button>

        <button data-dir="up">⬆️</button>

        <button class="empty">.</button>

        <button data-dir="left">⬅️</button>

        <button data-dir="down">⬇️</button>

        <button data-dir="right">➡️</button>

    </div>

    <div class="message" id="message">
        Tekan Mulai untuk bermain
    </div>

</div>


<script>

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const N = 26;
const cell = canvas.width / N;

const levelEl = document.getElementById("level");
const scoreEl = document.getElementById("score");
const targetEl = document.getElementById("target");
const messageEl = document.getElementById("message");

const startButton = document.getElementById("start");
const pauseButton = document.getElementById("pause");
const restartButton = document.getElementById("restart");


/*
    TARGET MAKANAN SETIAP LEVEL
*/

const targets = [
    5,   // Level 1
    8,   // Level 2
    10,  // Level 3
    12,  // Level 4
    15,  // Level 5
    18,  // Level 6
    20,  // Level 7
    25,  // Level 8
    30,  // Level 9
    40   // Level 10
];


/*
    KECEPATAN ULAR
    Semakin kecil = semakin cepat
*/

const speeds = [
    180,
    165,
    150,
    135,
    120,
    105,
    90,
    75,
    60,
    45
];


let snake;
let food;

let direction;
let nextDirection;

let score;
let level;

let running = false;
let paused = false;

let gameTimer;

let obstacles = [];


/*
    RESET GAME
*/

function resetGame() {

    snake = [
        { x: 13, y: 13 },
        { x: 12, y: 13 },
        { x: 11, y: 13 }
    ];

    direction = {
        x: 1,
        y: 0
    };

    nextDirection = {
        x: 1,
        y: 0
    };

    score = 0;
    level = 1;

    running = false;
    paused = false;

    obstacles = [];

    food = createFood();

    pauseButton.textContent = "⏸ Pause";

    updateUI();

    draw();

    messageEl.textContent =
        "Tekan Mulai untuk bermain";
}


/*
    UPDATE INFORMASI
*/

function updateUI() {

    levelEl.textContent = level;

    scoreEl.textContent = score;

    targetEl.textContent =
        targets[level - 1];
}


/*
    MEMBUAT MAKANAN
*/

function createFood() {

    let position;

    do {

        position = {
            x: Math.floor(Math.random() * N),
            y: Math.floor(Math.random() * N)
        };

    } while (

        snake.some(
            part =>
            part.x === position.x &&
            part.y === position.y
        )

        ||

        obstacles.some(
            obstacle =>
            obstacle.x === position.x &&
            obstacle.y === position.y
        )

    );

    return position;
}


/*
    MEMBUAT RINTANGAN
*/

function createObstacles() {

    obstacles = [];

    /*
        Level 1-3 tidak ada rintangan
        Level 4 mulai ada rintangan
    */

    const amount =
        Math.max(0, (level - 3) * 3);

    let attempts = 0;

    while (
        obstacles.length < amount &&
        attempts < 1000
    ) {

        attempts++;

        const obstacle = {

            x: Math.floor(Math.random() * N),

            y: Math.floor(Math.random() * N)

        };


        /*
            Jangan membuat rintangan
            terlalu dekat dengan ular awal
        */

        if (
            Math.abs(obstacle.x - 13) < 4 &&
            Math.abs(obstacle.y - 13) < 4
        ) {
            continue;
        }


        /*
            Jangan bertabrakan dengan ular
        */

        if (
            snake.some(
                part =>
                part.x === obstacle.x &&
                part.y === obstacle.y
            )
        ) {
            continue;
        }


        /*
            Jangan bertumpuk
        */

        if (
            obstacles.some(
                item =>
                item.x === obstacle.x &&
                item.y === obstacle.y
            )
        ) {
            continue;
        }


        obstacles.push(obstacle);
    }
}


/*
    MULAI GAME
*/

function startGame() {

    if (running) {
        return;
    }

    running = true;
    paused = false;

    messageEl.textContent =
        "Arahkan ular dan makan makanan!";

    scheduleNextMove();
}


/*
    TIMER GAME
*/

function scheduleNextMove() {

    clearTimeout(gameTimer);

    if (
        running &&
        !paused
    ) {

        gameTimer = setTimeout(
            gameLoop,
            speeds[level - 1]
        );

    }
}


/*
    GAME LOOP
*/

function gameLoop() {

    const head = {

        x: snake[0].x + nextDirection.x,

        y: snake[0].y + nextDirection.y

    };


    direction = nextDirection;


    /*
        CEK TABRAK DINDING
    */

    if (
        head.x < 0 ||
        head.x >= N ||
        head.y < 0 ||
        head.y >= N
    ) {

        gameOver();

        return;
    }


    /*
        CEK TABRAK BADAN ULAR
    */

    if (
        snake.some(
            part =>
            part.x === head.x &&
            part.y === head.y
        )
    ) {

        gameOver();

        return;
    }


    /*
        CEK TABRAK RINTANGAN
    */

    if (
        obstacles.some(
            obstacle =>
            obstacle.x === head.x &&
            obstacle.y === head.y
        )
    ) {

        gameOver();

        return;
    }


    /*
        TAMBAHKAN KEPALA BARU
    */

    snake.unshift(head);


    /*
        MAKAN MAKANAN
    */

    if (
        head.x === food.x &&
        head.y === food.y
    ) {

        score++;


        /*
            CEK NAIK LEVEL
        */

        if (
            score >=
            targets[level - 1]
        ) {

            if (level < 10) {

                level++;

                createObstacles();

                messageEl.textContent =
                    "🎉 Hebat! Naik ke Level " +
                    level + "!";

            }

            else {

                score =
                    targets[9];

                winGame();

                draw();

                return;
            }


            /*
                Buat makanan baru
            */

            food = createFood();

        }
        else {

            food = createFood();

        }

    }

    else {

        /*
            Jika tidak makan,
            ekor dihapus
        */

        snake.pop();

    }


    updateUI();

    draw();

    scheduleNextMove();
}


/*
    GAME OVER
*/

function gameOver() {

    running = false;

    clearTimeout(gameTimer);

    messageEl.textContent =
        "💥 GAME OVER! Tekan Ulangi untuk mencoba lagi.";

    draw(true);
}


/*
    MENANG LEVEL 10
*/

function winGame() {

    running = false;

    clearTimeout(gameTimer);

    messageEl.textContent =
        "🏆 MASTER SNAKE! Kamu menamatkan Level 10!";

}


/*
    PAUSE
*/

function togglePause() {

    if (!running) {
        return;
    }

    paused = !paused;


    if (paused) {

        pauseButton.textContent =
            "▶ Lanjut";

        messageEl.textContent =
            "⏸ Game dijeda";

    }

    else {

        pauseButton.textContent =
            "⏸ Pause";

        messageEl.textContent =
            "Ayo lanjut!";

        scheduleNextMove();

    }

}


/*
    ARAH ULAR
*/

function setDirection(directionName) {

    const directions = {

        up: {
            x: 0,
            y: -1
        },

        down: {
            x: 0,
            y: 1
        },

        left: {
            x: -1,
            y: 0
        },

        right: {
            x: 1,
            y: 0
        }

    };


    const newDirection =
        directions[directionName];


    /*
        Tidak boleh langsung
        berbalik arah
    */

    if (
        newDirection.x === -direction.x &&
        newDirection.y === -direction.y
    ) {

        return;

    }


    nextDirection =
        newDirection;
}


/*
    KEYBOARD
*/

document.addEventListener(
    "keydown",
    function(event) {

        const keyMap = {

            ArrowUp: "up",
            w: "up",
            W: "up",

            ArrowDown: "down",
            s: "down",
            S: "down",

            ArrowLeft: "left",
            a: "left",
            A: "left",

            ArrowRight: "right",
            d: "right",
            D: "right"

        };


        if (keyMap[event.key]) {

            event.preventDefault();

            setDirection(
                keyMap[event.key]
            );

        }


        /*
            Tombol Space = Pause
        */

        if (event.key === " ") {

            event.preventDefault();

            togglePause();

        }

    }
);


/*
    TOMBOL HP
*/

document
    .querySelectorAll("[data-dir]")
    .forEach(button => {

        button.addEventListener(
            "click",
            function() {

                setDirection(
                    button.dataset.dir
                );

            }
        );

    });


/*
    BUTTON GAME
*/

startButton.onclick =
    startGame;

pauseButton.onclick =
    togglePause;

restartButton.onclick =
    function() {

        resetGame();

        startGame();

    };


/*
    SWIPE DI HP
*/

let touchStart = null;


canvas.addEventListener(
    "touchstart",
    function(event) {

        const touch =
            event.touches[0];

        touchStart = {

            x: touch.clientX,

            y: touch.clientY

        };

    },
    {
        passive: true
    }
);


canvas.addEventListener(
    "touchend",
    function(event) {

        if (!touchStart) {
            return;
        }


        const touch =
            event.changedTouches[0];


        const dx =
            touch.clientX -
            touchStart.x;


        const dy =
            touch.clientY -
            touchStart.y;


        if (
            Math.max(
                Math.abs(dx),
                Math.abs(dy)
            ) > 25
        ) {

            if (
                Math.abs(dx) >
                Math.abs(dy)
            ) {

                setDirection(
                    dx > 0
                    ? "right"
                    : "left"
                );

            }

            else {

                setDirection(
                    dy > 0
                    ? "down"
                    : "up"
                );

            }

        }


        touchStart = null;

    },
    {
        passive: true
    }
);


/*
    GAMBAR GAME
*/

function draw(gameOver = false) {

    /*
        Background
    */

    ctx.fillStyle = "#07120a";

    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    /*
        GRID
    */

    ctx.strokeStyle = "#102316";

    ctx.lineWidth = 1;


    for (
        let i = 0;
        i <= N;
        i++
    ) {

        ctx.beginPath();

        ctx.moveTo(
            i * cell,
            0
        );

        ctx.lineTo(
            i * cell,
            canvas.height
        );

        ctx.stroke();


        ctx.beginPath();

        ctx.moveTo(
            0,
            i * cell
        );

        ctx.lineTo(
            canvas.width,
            i * cell
        );

        ctx.stroke();

    }


    /*
        RINTANGAN
    */

    ctx.fillStyle = "#666";


    obstacles.forEach(
        obstacle => {

            roundedRectangle(

                obstacle.x * cell + 3,

                obstacle.y * cell + 3,

                cell - 6,

                cell - 6,

                5

            );

        }
    );


    /*
        MAKANAN
    */

    ctx.fillStyle = "#e33";

    ctx.beginPath();

    ctx.arc(

        food.x * cell + cell / 2,

        food.y * cell + cell / 2,

        cell * 0.34,

        0,

        Math.PI * 2

    );

    ctx.fill();


    /*
        ULAR
    */

    snake.forEach(
        (part, index) => {

            if (index === 0) {

                ctx.fillStyle =
                    "#7cff5b";

            }

            else {

                ctx.fillStyle =
                    "#27c943";

            }


            roundedRectangle(

                part.x * cell + 2,

                part.y * cell + 2,

                cell - 4,

                cell - 4,

                5

            );

        }
    );


    /*
        OVERLAY GAME OVER
    */

    if (gameOver) {

        ctx.fillStyle =
            "rgba(0,0,0,0.65)";

        ctx.fillRect(
            0,
            0,
            canvas.width,
            canvas.height
        );


        ctx.fillStyle =
            "#fff";

        ctx.textAlign =
            "center";

        ctx.font =
            "bold 38px Arial";


        ctx.fillText(
            "GAME OVER",
            canvas.width / 2,
            canvas.height / 2
        );

    }

}


/*
    KOTAK ROUNDED
*/

function roundedRectangle(
    x,
    y,
    width,
    height,
    radius
) {

    ctx.beginPath();

    ctx.moveTo(
        x + radius,
        y
    );

    ctx.arcTo(
        x + width,
        y,
        x + width,
        y + height,
        radius
    );

    ctx.arcTo(
        x + width,
        y + height,
        x,
        y + height,
        radius
    );

    ctx.arcTo(
        x,
        y + height,
        x,
        y,
        radius
    );

    ctx.arcTo(
        x,
        y,
        x + width,
        y,
        radius
    );

    ctx.closePath();

    ctx.fill();

}


/*
    JALANKAN PERTAMA KALI
*/

resetGame();

</script>

</body>
</html>
