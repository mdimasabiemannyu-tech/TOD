```html
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Truth or Dare 4 Pemain</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: linear-gradient(135deg, #12002b, #4b0082, #1a0033);
    color: white;
    min-height: 100vh;
}

.container {
    width: 100%;
    max-width: 520px;
    margin: auto;
    padding: 20px;
}

.logo {
    text-align: center;
    font-size: 48px;
    font-weight: bold;
    margin-top: 20px;
}

.logo span {
    color: #ffcc00;
}

.subtitle {
    text-align: center;
    color: #ddd;
    margin-bottom: 25px;
}

.box {
    background: rgba(255,255,255,0.10);
    padding: 20px;
    border-radius: 22px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.35);
}

h2 {
    text-align: center;
    margin-top: 0;
}

input {
    width: 100%;
    padding: 15px;
    margin: 7px 0;
    border: none;
    border-radius: 12px;
    font-size: 16px;
}

button {
    width: 100%;
    padding: 16px;
    margin-top: 12px;
    border: none;
    border-radius: 14px;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
}

.start {
    background: #00e676;
    color: #003b1c;
}

.truth {
    background: #2196f3;
    color: white;
}

.dare {
    background: #ff1744;
    color: white;
}

.next {
    background: #ffcc00;
    color: #332800;
}

.reset {
    background: white;
    color: #222;
}

.players {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin: 15px 0;
}

.player {
    background: rgba(255,255,255,0.12);
    padding: 12px;
    border-radius: 14px;
    text-align: center;
}

.player.active {
    border: 3px solid #00e676;
    box-shadow: 0 0 15px #00e676;
}

.player .emoji {
    font-size: 30px;
}

.player .name {
    font-weight: bold;
    margin-top: 5px;
}

.player .score {
    color: #ffcc00;
    margin-top: 5px;
}

.turn {
    text-align: center;
    font-size: 21px;
    font-weight: bold;
    margin: 20px 0;
}

.card {
    background: rgba(0,0,0,0.35);
    border-radius: 18px;
    padding: 25px 15px;
    min-height: 170px;

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;

    text-align: center;
}

.card-title {
    font-size: 25px;
    font-weight: bold;
    margin-bottom: 15px;
}

.question {
    font-size: 20px;
    line-height: 1.4;
}

.points {
    color: #00e676;
    font-size: 20px;
    font-weight: bold;
    margin-top: 15px;
}

.choice {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
}

.choice button {
    margin-top: 15px;
}

.hidden {
    display: none;
}

.footer {
    text-align: center;
    color: #aaa;
    font-size: 13px;
    margin-top: 20px;
}

@media(max-width: 380px) {

    .logo {
        font-size: 40px;
    }

    .question {
        font-size: 18px;
    }

    .turn {
        font-size: 18px;
    }
}
</style>
</head>

<body>

<div class="container">

    <!-- ========================= -->
    <!-- HALAMAN UTAMA -->
    <!-- ========================= -->

    <div id="menu">

        <div class="logo">
            TRUTH <span>OR</span> DARE
        </div>

        <div class="subtitle">
            🔥 Party Game • 4 Pemain
        </div>

        <div class="box">

            <h2>👥 Masukkan Nama Pemain</h2>

            <input id="player1" type="text" placeholder="👤 Pemain 1">

            <input id="player2" type="text" placeholder="👤 Pemain 2">

            <input id="player3" type="text" placeholder="👤 Pemain 3">

            <input id="player4" type="text" placeholder="👤 Pemain 4">

            <button class="start" onclick="startGame()">
                🚀 MULAI GAME
            </button>

        </div>

        <div class="footer">
            Truth or Dare Multiplayer 4 Pemain
        </div>

    </div>


    <!-- ========================= -->
    <!-- HALAMAN GAME -->
    <!-- ========================= -->

    <div id="game" class="hidden">

        <div class="logo">
            🔥 TOD
        </div>

        <div class="subtitle">
            Truth or Dare
        </div>


        <!-- PLAYER -->

        <div class="players">

            <div id="playerBox0" class="player">
                <div class="emoji">😎</div>
                <div id="name0" class="name">Player 1</div>
                <div id="score0" class="score">0 Poin</div>
            </div>

            <div id="playerBox1" class="player">
                <div class="emoji">😈</div>
                <div id="name1" class="name">Player 2</div>
                <div id="score1" class="score">0 Poin</div>
            </div>

            <div id="playerBox2" class="player">
                <div class="emoji">🤪</div>
                <div id="name2" class="name">Player 3</div>
                <div id="score2" class="score">0 Poin</div>
            </div>

            <div id="playerBox3" class="player">
                <div class="emoji">🤠</div>
                <div id="name3" class="name">Player 4</div>
                <div id="score3" class="score">0 Poin</div>
            </div>

        </div>


        <!-- GILIRAN -->

        <div class="turn">
            🎯 Giliran:
            <span id="turnName">Player 1</span>
        </div>


        <!-- PILIHAN -->

        <div class="box">

            <h2>Pilih Tantangan</h2>

            <div class="choice">

                <button class="truth" onclick="truth()">
                    💙 TRUTH
                </button>

                <button class="dare" onclick="dare()">
                    ❤️ DARE
                </button>

            </div>


            <!-- HASIL -->

            <div id="card" class="card">

                <div class="card-title">
                    🎲 SIAP?
                </div>

                <div class="question">
                    Pilih Truth atau Dare
                </div>

            </div>


            <!-- NEXT -->

            <button class="next" onclick="nextPlayer()">
                ➡️ PEMAIN BERIKUTNYA
            </button>

            <button class="reset" onclick="backToMenu()">
                🏠 KEMBALI KE MENU
            </button>

        </div>

    </div>

</div>


<script>

/* =========================
   DATA GAME
========================= */

let names = [];

let scores = [0, 0, 0, 0];

let currentPlayer = 0;


/* =========================
   TRUTH
========================= */

const truths = [

    "Siapa orang terakhir yang kamu chat hari ini?",

    "Apa hal paling memalukan yang pernah kamu lakukan?",

    "Siapa orang yang paling sering kamu pikirkan?",

    "Apa kebiasaan aneh yang kamu punya?",

    "Apa ketakutan terbesar kamu?",

    "Pernahkah kamu berbohong kepada temanmu?",

    "Apa makanan yang paling tidak kamu suka?",

    "Siapa pemain di sini yang paling kamu percaya?",

    "Siapa pemain di sini yang paling lucu?",

    "Apa impian terbesar kamu?",

    "Kalau punya Rp100 juta, apa yang akan kamu beli?",

    "Apa hal yang paling kamu sesali?",

    "Pernahkah kamu menyukai seseorang secara diam-diam?",

    "Apa hal pertama yang kamu lakukan setelah bangun tidur?",

    "Apa rahasia kecil yang boleh kamu ceritakan sekarang?"

];


/* =========================
   DARE
========================= */

const dares = [

    "Joget selama 20 detik tanpa musik.",

    "Tirukan suara ayam selama 15 detik.",

    "Nyanyikan lagu favoritmu dengan gaya opera.",

    "Buat ekspresi wajah paling aneh selama 10 detik.",

    "Lakukan 10 kali squat.",

    "Tirukan gaya pemain lain selama 20 detik.",

    "Bicara seperti robot selama 30 detik.",

    "Berjalan seperti model selama 15 detik.",

    "Buat pantun spontan untuk pemain di sebelahmu.",

    "Tertawa tanpa alasan selama 15 detik.",

    "Lakukan pose superhero selama 20 detik.",

    "Nyanyikan lagu anak-anak dengan serius.",

    "Bicara menggunakan suara bayi selama 20 detik.",

    "Lakukan 5 push-up.",

    "Buat iklan produk random selama 30 detik.",

    "Tirukan selebriti favoritmu selama 20 detik."

];


/* =========================
   MULAI GAME
========================= */

function startGame() {

    names[0] =
        document.getElementById("player1").value.trim()
        || "Player 1";

    names[1] =
        document.getElementById("player2").value.trim()
        || "Player 2";

    names[2] =
        document.getElementById("player3").value.trim()
        || "Player 3";

    names[3] =
        document.getElementById("player4").value.trim()
        || "Player 4";


    scores = [0, 0, 0, 0];

    currentPlayer = 0;


    /* MASUK KE GAME */

    document.getElementById("menu")
        .classList.add("hidden");

    document.getElementById("game")
        .classList.remove("hidden");


    /* NAMA PLAYER */

    for(let i = 0; i < 4; i++) {

        document.getElementById("name" + i)
            .innerText = names[i];

        document.getElementById("score" + i)
            .innerText = "0 Poin";

    }


    updateTurn();

}


/* =========================
   UPDATE GILIRAN
========================= */

function updateTurn() {

    document.getElementById("turnName")
        .innerText = names[currentPlayer];


    for(let i = 0; i < 4; i++) {

        document.getElementById("playerBox" + i)
            .classList.remove("active");

    }


    document.getElementById("playerBox" + currentPlayer)
        .classList.add("active");


    document.getElementById("card").innerHTML = `

        <div class="card-title">
            🎲 SIAP?
        </div>

        <div class="question">
            ${names[currentPlayer]}, pilih
            <b>Truth</b> atau <b>Dare</b>!
        </div>

    `;

}


/* =========================
   RANDOM
========================= */

function randomQuestion(array) {

    return array[
        Math.floor(Math.random() * array.length)
    ];

}


/* =========================
   TRUTH
========================= */

function truth() {

    let question = randomQuestion(truths);


    scores[currentPlayer] += 10;


    document.getElementById("card").innerHTML = `

        <div class="card-title">
            💙 TRUTH
        </div>

        <div class="question">
            ${question}
        </div>

        <div class="points">
            +10 Poin
        </div>

    `;


    updateScores();

}


/* =========================
   DARE
========================= */

function dare() {

    let question = randomQuestion(dares);


    scores[currentPlayer] += 20;


    document.getElementById("card").innerHTML = `

        <div class="card-title">
            ❤️ DARE
        </div>

        <div class="question">
            ${question}
        </div>

        <div class="points">
            +20 Poin
        </div>

    `;


    updateScores();

}


/* =========================
   UPDATE SCORE
========================= */

function updateScores() {

    for(let i = 0; i < 4; i++) {

        document.getElementById("score" + i)
            .innerText = scores[i] + " Poin";

    }

}


/* =========================
   PLAYER BERIKUTNYA
========================= */

function nextPlayer() {

    currentPlayer++;


    if(currentPlayer >= 4) {

        currentPlayer = 0;

    }


    updateTurn();

}


/* =========================
   KEMBALI MENU
========================= */

function backToMenu() {

    document.getElementById("game")
        .classList.add("hidden");

    document.getElementById("menu")
        .classList.remove("hidden");

}


/* =========================
   ENTER KEY
========================= */

document.addEventListener("keydown", function(event) {

    if(event.key === "Enter") {

        if(!document.getElementById("menu")
            .classList.contains("hidden")) {

            startGame();

        }

    }

});

</script>

</body>
</html>
```
